<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSakshi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="auraSakshi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgSakshi)"/>
  
  <!-- Outer Ornate Border -->
  <rect x="20" y="20" width="760" height="460" rx="8" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4" opacity="0.75"/>
  <rect x="30" y="30" width="740" height="440" rx="6" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.5"/>

  <!-- Golden Radiance Aura -->
  <circle cx="400" cy="230" r="180" fill="url(#auraSakshi)"/>

  <!-- Temple Arch Mandapam -->
  <path d="M 260 380 L 260 210 Q 400 110 540 210 L 540 380 Z" fill="#292524" opacity="0.6" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Sacred Modak & Writing Scribe Stylus Emblem -->
  <circle cx="400" cy="200" r="55" fill="#f59e0b" stroke="#fef08a" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Trishul / Tilak on Forehead -->
  <path d="M 396 165 L 404 165 L 400 185 Z" fill="#dc2626"/>
  <circle cx="400" cy="192" r="3" fill="#dc2626"/>

  <!-- Elephant Trunk Curve (Symbolic of Vinayaka) -->
  <path d="M 400 215 Q 408 245 425 245 Q 435 245 435 235 Q 435 225 422 225" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Big Ears -->
  <path d="M 345 185 Q 315 170 330 220 Q 345 235 355 210" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 455 185 Q 485 170 470 220 Q 455 235 445 210" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>

  <!-- Divine Scroll / Sacred Ledger of Kashi Yatra -->
  <rect x="350" y="270" width="100" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <line x1="360" y1="282" x2="440" y2="282" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <line x1="360" y1="292" x2="440" y2="292" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <line x1="360" y1="302" x2="415" y2="302" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Text Details -->
  <text x="400" y="80" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="bold" fill="#fef08a" letter-spacing="2">
    SHRI SAKSHI VINAYAK TEMPLE
  </text>
  <text x="400" y="112" text-anchor="middle" font-family="'Segoe UI Historic', 'Noto Sans Devanagari', serif" font-size="19" fill="#fde68a" letter-spacing="1">
    ॥ साक्षी विनायक मन्दिर • काशी विश्वनाथ गली ॥
  </text>
  <text x="400" y="355" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="600" fill="#fef08a">
    SUPREME DIVINE WITNESS OF KASHI PILGRIMAGE
  </text>
  <text x="400" y="380" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#fed7aa">
    Records &amp; Confirms Every Devotee&apos;s Pilgrimage to Vishwanath &amp; Ganga Snan
  </text>
  <text x="400" y="440" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fcd34d" opacity="0.9">
    Location: D-10/50, Dasaswamedh Vishwanath Gully • Kashi Sanctum
  </text>
</svg>