<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPado" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="auraPado" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bgPado)"/>
  
  <rect x="20" y="20" width="760" height="460" rx="8" fill="none" stroke="#86efac" stroke-width="2" stroke-dasharray="6,4" opacity="0.75"/>
  <rect x="30" y="30" width="740" height="440" rx="6" fill="none" stroke="#bbf7d0" stroke-width="1" opacity="0.5"/>

  <circle cx="400" cy="230" r="180" fill="url(#auraPado)"/>

  <!-- Holy River Confluence Waves Motif -->
  <path d="M 260 360 Q 400 320 540 360 Z" fill="#0284c7" opacity="0.6"/>
  <path d="M 280 340 Q 400 300 520 340 Z" fill="#38bdf8" opacity="0.5"/>

  <!-- Temple Mandapam -->
  <path d="M 270 340 L 270 190 Q 400 95 530 190 L 530 340 Z" fill="#052e16" opacity="0.6" stroke="#86efac" stroke-width="2"/>
  
  <!-- Divine Footprints of Lord Vishnu (Charana Paduka) -->
  <ellipse cx="375" cy="235" rx="18" ry="32" fill="#fde047" stroke="#b45309" stroke-width="2" filter="url(#glow)"/>
  <circle cx="375" cy="195" r="5" fill="#fde047"/>
  <circle cx="367" cy="199" r="4" fill="#fde047"/>
  <circle cx="383" cy="199" r="4" fill="#fde047"/>

  <ellipse cx="425" cy="235" rx="18" ry="32" fill="#fde047" stroke="#b45309" stroke-width="2" filter="url(#glow)"/>
  <circle cx="425" cy="195" r="5" fill="#fde047"/>
  <circle cx="417" cy="199" r="4" fill="#fde047"/>
  <circle cx="433" cy="199" r="4" fill="#fde047"/>

  <!-- Lotus Base for Padukas -->
  <ellipse cx="400" cy="275" rx="80" ry="18" fill="#f43f5e" stroke="#ffe4e6" stroke-width="2"/>

  <!-- Text Details -->
  <text x="400" y="72" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="bold" fill="#fef08a" letter-spacing="2">
    PADODAK TEERTH (VISHNU CHARAN TEERTH)
  </text>
  <text x="400" y="102" text-anchor="middle" font-family="'Segoe UI Historic', 'Noto Sans Devanagari', serif" font-size="18" fill="#bbf7d0" letter-spacing="1">
    ॥ पादोदक तीर्थ • श्री आदिकेशव चरणामृत तीर्थ ॥
  </text>
  <text x="400" y="375" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="600" fill="#fef08a">
    WHERE LORD VISHNU WASHED HIS LOTUS FEET UPON ENTERING KASHI
  </text>
  <text x="400" y="400" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dcfce7">
    Sanctified by Adi Keshav at the Varuna-Ganga Confluence &bull; Kashi Khand Ch. 58
  </text>
  <text x="400" y="445" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac" opacity="0.9">
    Adjacent to Adi Keshav Temple &bull; Rajghat Fort / Varuna Sangam
  </text>
</svg>